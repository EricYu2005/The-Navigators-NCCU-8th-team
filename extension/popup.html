<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>好選保健 PurePick 擴充套件</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #f8fafc;
      color: #1e1b4b;
      padding: 0;
      margin: 0;
    }
    .popup-header {
      background: linear-gradient(135deg, #3b0764 0%, #6d28d9 100%);
      color: #ffffff;
      padding: 14px 16px;
    }
    .popup-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
    }
    .popup-sub {
      font-size: 11px;
      color: #e9d5ff;
      margin-top: 2px;
    }
    .icon-svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .popup-body {
      padding: 14px 16px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #16a34a;
      border-radius: 50%;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12.5px;
      font-weight: 600;
      color: #334155;
    }
    .stat-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      text-align: center;
    }
    .stat-box { flex: 1; }
    .stat-box:first-child { border-right: 1px solid #f1f5f9; }
    .stat-val { font-size: 14px; font-weight: 800; color: #6d28d9; }
    .stat-lbl { font-size: 10.5px; color: #64748b; margin-top: 2px; }
    .popup-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
    }
    .btn-primary {
      background: #6d28d9;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #5b21b6;
    }
    .btn-outline {
      background: #ffffff;
      color: #475569;
      border: 1.5px solid #cbd5e1;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }
    .popup-footer {
      padding: 10px 16px 14px 16px;
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="popup-brand">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>好選保健 PurePick 擴充助手</span>
    </div>
    <div class="popup-sub">momo / 蝦皮 / Costco 購物車去冗截擊</div>
  </div>

  <div class="popup-body">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>即時防護運行中 (Active)</span>
    </div>

    <div class="toggle-row">
      <span>購物車成分主動截擊</span>
      <input type="checkbox" checked id="chk-intercept" />
    </div>
    <div class="toggle-row">
      <span>衛福部 DRIs 安全上限監控</span>
      <input type="checkbox" checked id="chk-dris" />
    </div>

    <div class="stat-card">
      <div class="stat-box">
        <div class="stat-val" id="stat-intercept-count">2 次</div>
        <div class="stat-lbl">本月攔截重複</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-savings-val">NT$ 1,280</div>
        <div class="stat-lbl">去冗省下開銷</div>
      </div>
    </div>

    <div class="popup-actions">
      <button type="button" class="btn btn-primary" id="btn-manual-scan">
        立即掃描目前分頁購物車
      </button>
      <button type="button" class="btn btn-outline" id="btn-open-web">
        開啟 PurePick 完整去冗平台
      </button>
    </div>
  </div>

  <div class="popup-footer">
    國立政治大學 創新創業入門 第八組專案<br />
    本網頁僅供政大創創入門課程使用，非正式平台
  </div>

  <script src="popup.js"></script>
</body>
</html>
