<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- PurePick 品牌漸層：深邃科技藍紫與清新翠綠 -->
    <linearGradient id="ppBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="pillGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="pillGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="ppShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.32" />
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#ppBgGrad)" filter="url(#ppShadow)" />

  <!-- 柔和科技裝飾微環 -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 10" opacity="0.22" />

  <!-- 核心群組：PurePick 膠囊膠囊與智慧精選標記 -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#pillShadow)">
    <!-- 膠囊上半部 (純淨白 Pure) -->
    <path d="M 206 140 C 206 102 236 72 274 72 C 312 72 342 102 342 140 L 342 248 L 206 248 Z" 
          fill="url(#pillGradTop)" />
    
    <!-- 膠囊腰線分隔 (精準分割) -->
    <line x1="202" y1="250" x2="346" y2="250" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round" />

    <!-- 膠囊下半部 (活力綠 Pick) -->
    <path d="M 206 252 L 342 252 L 342 360 C 342 398 312 428 274 428 C 236 428 206 398 206 360 Z" 
          fill="url(#pillGradBottom)" />

    <!-- 膠囊內部立體反光曲線 -->
    <path d="M 228 140 C 228 116 246 98 268 98 L 268 234 L 228 234 Z" 
          fill="#ffffff" opacity="0.35" />
    
    <!-- 下半部營養粒子微點 (象徵足量有效成分) -->
    <circle cx="246" cy="300" r="10" fill="#ffffff" opacity="0.6" />
    <circle cx="298" cy="320" r="8" fill="#ffffff" opacity="0.5" />
    <circle cx="260" cy="360" r="12" fill="#ffffff" opacity="0.55" />
    <circle cx="304" cy="376" r="9" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- 右下方智慧嚴選標章 (PurePick Check Badge) -->
  <g transform="translate(356, 356)">
    <circle cx="0" cy="0" r="48" fill="#ffffff" filter="url(#pillShadow)" />
    <circle cx="0" cy="0" r="40" fill="url(#sparkleGrad)" />
    <!-- 象徵嚴選通過的白色勾勾 -->
    <path d="M -16 0 L -4 12 L 18 -10" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 左上方純淨星芒 (Pure Sparkle) -->
  <g transform="translate(136, 136)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
