<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Background (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Protective Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Medical Cross Base -->
  <path d="M 220 130 H 292 V 220 H 382 V 292 H 292 V 382 H 220 V 292 H 130 V 220 H 220 Z" 
        fill="#ffffff" rx="16" />

  <!-- Heartbeat / Health Trajectory Pulse Wave in Center -->
  <path d="M 170 256 L 210 256 L 230 200 L 260 312 L 285 235 L 305 256 L 342 256" 
        fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Shield Badge Accent at Bottom Right -->
  <circle cx="360" cy="360" r="42" fill="#10b981" stroke="#ffffff" stroke-width="6" />
  <path d="M 346 360 L 356 370 L 376 348" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>